<?xml version="1.0" encoding="UTF-8"?>
<svg width="2149" height="1299" viewBox="0 0 2149 1299" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- メイングラデーション -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:{{PRIMARY_COLOR}};stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:{{SECONDARY_COLOR}};stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:{{PRIMARY_COLOR}};stop-opacity:0.95" />
    </linearGradient>
    
    <!-- オーバーレイグラデーション -->
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- シャドウフィルター -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 白いコンテナのシャドウ -->
    <filter id="containerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    
    <!-- QRコードシャドウ -->
    <filter id="qrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="2149" height="1299" fill="url(#mainGradient)"/>
  <rect width="2149" height="1299" fill="url(#overlay)"/>
  
  <!-- 装飾的背景パターン -->
  <g opacity="0.1">
    <circle cx="300" cy="200" r="150" fill="#ffffff"/>
    <circle cx="1850" cy="1100" r="120" fill="#ffffff"/>
    <circle cx="1950" cy="250" r="80" fill="#ffffff"/>
    <circle cx="200" cy="950" r="60" fill="#ffffff"/>
  </g>
  
  <!-- メインコンテンツコンテナ -->
  <g id="mainContainer">
    <!-- 白い背景コンテナ -->
    <rect x="150" y="200" width="1850" height="900" rx="40" ry="40" 
          fill="rgba(255, 255, 255, 0.95)" 
          filter="url(#containerShadow)"/>
    
    <!-- ロゴエリア（左上） -->
    <g id="logoSection" transform="translate(250, 300)">
      <rect x="-30" y="-30" width="360" height="210" rx="20" 
            fill="rgba(255, 255, 255, 0.9)" 
            stroke="rgba(0,0,0,0.1)" 
            stroke-width="1"/>
      <image id="companyLogo" x="0" y="0" width="300" height="150" 
             href="{{LOGO_IMAGE}}" 
             opacity="{{LOGO_OPACITY}}"/>
    </g>
    
    <!-- メインタイトルエリア -->
    <g id="titleSection" transform="translate(700, 350)">
      <text id="mainTitle" x="0" y="0" 
            font-family="'Noto Sans JP', 'Hiragino Sans', system-ui, sans-serif" 
            font-size="{{TITLE_SIZE}}" 
            font-weight="bold" 
            fill="#2d3748" 
            text-anchor="start" 
            dominant-baseline="central">
        {{MAIN_TITLE}}
      </text>
      
      <text id="subTitle" x="0" y="100" 
            font-family="'Noto Sans JP', 'Hiragino Sans', system-ui, sans-serif" 
            font-size="{{SUB_TITLE_SIZE}}" 
            font-weight="normal" 
            fill="#4a5568" 
            text-anchor="start" 
            dominant-baseline="central"
            opacity="{{SUB_TITLE_OPACITY}}">
        {{SUB_TITLE}}
      </text>
    </g>
    
    <!-- QRコードセクション（右側） -->
    <g id="qrSection" transform="translate(1450, 400)">
      <!-- QRコード背景 -->
      <rect x="-40" y="-40" width="480" height="480" rx="25" 
            fill="#ffffff" 
            stroke="{{PRIMARY_COLOR}}" 
            stroke-width="4" 
            filter="url(#qrShadow)"/>
      
      <!-- QRコード -->
      <image id="surveyQR" x="0" y="0" width="400" height="400" 
             href="{{QR_CODE_DATA}}"/>
      
      <!-- QRコード説明テキスト -->
      <text x="200" y="460" 
            font-family="'Noto Sans JP', system-ui, sans-serif" 
            font-size="48" 
            font-weight="600" 
            fill="#2d3748" 
            text-anchor="middle" 
            dominant-baseline="central">
        {{QR_TEXT}}
      </text>
    </g>
    
    <!-- 説明テキストエリア（下部） -->
    <g id="descriptionSection" transform="translate(250, 950)">
      <text id="description" x="0" y="0" 
            font-family="'Noto Sans JP', system-ui, sans-serif" 
            font-size="{{DESC_SIZE}}" 
            font-weight="normal" 
            fill="#718096" 
            text-anchor="start" 
            dominant-baseline="central"
            opacity="{{DESC_OPACITY}}">
        {{DESCRIPTION}}
      </text>
    </g>
    
    <!-- アクセント装飾 -->
    <g id="accents">
      <!-- 左側アクセントライン -->
      <rect x="200" y="250" width="8" height="800" rx="4" 
            fill="{{PRIMARY_COLOR}}" opacity="0.7"/>
      
      <!-- 上部アクセントライン -->
      <rect x="200" y="250" width="1750" height="8" rx="4" 
            fill="{{PRIMARY_COLOR}}" opacity="0.3"/>
      
      <!-- 右側アクセント -->
      <circle cx="1900" cy="600" r="6" fill="{{SECONDARY_COLOR}}" opacity="0.6"/>
      <circle cx="1920" cy="650" r="4" fill="{{SECONDARY_COLOR}}" opacity="0.4"/>
      <circle cx="1880" cy="680" r="3" fill="{{PRIMARY_COLOR}}" opacity="0.5"/>
    </g>
  </g>
  
  <!-- 下部装飾ライン -->
  <rect x="0" y="1250" width="2149" height="12" rx="6" 
        fill="{{PRIMARY_COLOR}}" opacity="0.4"/>
  <rect x="0" y="1270" width="2149" height="6" rx="3" 
        fill="{{SECONDARY_COLOR}}" opacity="0.6"/>
        
</svg>