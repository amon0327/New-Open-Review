<?xml version="1.0" encoding="UTF-8"?>
<svg width="2149" height="1299" viewBox="0 0 2149 1299" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- 背景 -->
  <defs>
    <!-- 背景画像用のパターン定義 -->
    <pattern id="backgroundImage" patternUnits="userSpaceOnUse" width="2149" height="1299">
      <image id="bgImage" x="0" y="0" width="2149" height="1299" href="{{BACKGROUND_IMAGE}}" opacity="0.1"/>
    </pattern>
    
    <!-- グラデーション背景（デフォルト） -->
    <linearGradient id="defaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景矩形 -->
  <rect width="2149" height="1299" fill="{{BACKGROUND_FILL}}" stroke="none"/>
  
  <!-- ロゴ画像エリア（右上） -->
  <g id="logoArea" transform="translate(1800, 50)">
    <image id="logoImage" x="0" y="0" width="300" height="150" href="{{LOGO_IMAGE}}" opacity="{{LOGO_OPACITY}}"/>
  </g>
  
  <!-- QRコードエリア（左側中央） -->
  <g id="qrArea" transform="translate(107, 240)">
    <!-- QRコード背景（白い円角矩形） -->
    <rect x="-20" y="-20" width="950" height="950" rx="40" ry="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" opacity="0.95"/>
    <!-- QRコード画像 -->
    <image id="qrCode" x="0" y="0" width="910" height="910" href="{{QR_CODE_DATA}}"/>
  </g>
  
  <!-- テキストエリア（右側） -->
  <g id="textArea" transform="translate(1200, 650)">
    <!-- メインテキスト -->
    <text id="mainText" x="0" y="0" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="{{TEXT_SIZE}}" 
          font-weight="bold" 
          fill="{{TEXT_COLOR}}" 
          text-anchor="start" 
          dominant-baseline="central">
      {{MAIN_TEXT}}
    </text>
    
    <!-- サブテキスト（オプション） -->
    <text id="subText" x="0" y="120" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="{{SUB_TEXT_SIZE}}" 
          font-weight="normal" 
          fill="{{SUB_TEXT_COLOR}}" 
          text-anchor="start" 
          dominant-baseline="central"
          opacity="{{SUB_TEXT_OPACITY}}">
      {{SUB_TEXT}}
    </text>
  </g>
  
  <!-- 装飾要素（オプション） -->
  <g id="decorations" opacity="{{DECORATION_OPACITY}}">
    <!-- 装飾的な背景パターン -->
    <circle cx="2000" cy="200" r="100" fill="#5e17eb" opacity="0.05"/>
    <circle cx="100" cy="1100" r="80" fill="#764ba2" opacity="0.05"/>
    
    <!-- 境界線装飾 -->
    <rect x="50" y="50" width="2049" height="1199" 
          fill="none" 
          stroke="{{BORDER_COLOR}}" 
          stroke-width="{{BORDER_WIDTH}}" 
          stroke-dasharray="{{BORDER_DASH}}" 
          rx="20" ry="20" 
          opacity="{{BORDER_OPACITY}}"/>
  </g>
</svg>